name: iOS store screenshots

# Snímky pro App Store v češtině a ruštině, iPhone 6,9" a iPad 13" (mobile/iosApp/store/capture_screenshots.sh,
# test StoreScreenshotTests) jako artefakt; zkopírovat do mobile/iosApp/store/screenshots/<locale>/.
# Převzato z Ear4Music2. Jen ručně, nebo tagem ios-screenshots<cokoli>.
on:
  workflow_dispatch:
  push:
    tags: [ 'ios-screenshots*' ]

defaults:
  run:
    working-directory: mobile

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture
        run: iosApp/store/capture_screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-screenshots
          path: |
            mobile/build/ios/store/*/*.png
            mobile/build/ios/store/*.log
          if-no-files-found: warn
          retention-days: 7
