# XcodeGen: `xcodegen generate` (spouští ci.sh) vytvoří Statika.xcodeproj, který se necommituje –
# projekt se upravuje jako text a nikdy nekoliduje. Stejné uspořádání jako ~/dev/Ear4Music2/iosApp.
name: Statika
options:
  bundleIdPrefix: cz.usharik
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.13"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Krok Gradle zapisuje mimo sandbox, který Xcode skriptům dává.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Kotlin framework je jen pro simulátory na Apple silicon (iosSimulatorArm64).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
# Firebase (Analytics bez IDFA + Crashlytics) a AdMob + UMP přes Swift Package Manager.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.3"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  Statika:
    type: application
    platform: iOS
    sources:
      - path: Statika
        excludes:
          - Statika.storekit
      # v projektu (odkazuje na něj schéma), ale ne v balíčku aplikace
      - path: Statika/Statika.storekit
        buildPhase: none
    dependencies:
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Xcode spouští skripty bez prostředí shellu: JDK 21 jako v CI.
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home)}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # dSYM do Crashlytics jen u buildů pro App Store s Firebase plistem.
      - name: Upload dSYMs to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -f "$SRCROOT/Statika/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          else
            echo "Crashlytics upload skipped"
          fi
    info:
      path: Statika/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [cs, ru]
        CFBundleDevelopmentRegion: cs
        # odkazy statika://12345 otevřou úlohu podle čísla
        CFBundleURLTypes:
          - CFBundleURLName: cz.usharik.statika
            CFBundleURLSchemes: [statika]
        # iPhone na výšku i naležato, iPad všechny čtyři směry a multitasking (Split View / Slide Over)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Firebase nic nesbírá, dokud souhlas (UMP) nedovolí – SharedAds → NormalizedAnalytics.setConsent → FirebaseTelemetry.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseCrashlyticsCollectionEnabled: false
        # AdMob (AdMobBridge.swift): id aplikace a reklamních jednotek z nastavení buildu níže.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        StatikaBannerId: $(ADMOB_BANNER_ID)
        StatikaInterstitialId: $(ADMOB_INTERSTITIAL_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
