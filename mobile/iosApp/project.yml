    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.usharik.statika
        DEVELOPMENT_TEAM: B7PSU5B367
        # iPhone i iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Statika
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # -ObjC: Google Mobile Ads potřebuje své Objective-C kategorie.
        OTHER_LDFLAGS: [$(inherited), -ObjC, -framework, Shared]
        # Debug: testovací aplikace a jednotky Googlu.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2435281174
        ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
      configs:
        # Build pro App Store: certifikát Apple Distribution a profil „Statika App Store“.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Statika App Store
          # AdMob → aplikace „Statika: reakce nosníků“ (iOS), jednotky „banner“ (výsledek) a „interpage“ (mezistránková).
          ADMOB_APP_ID: ca-app-pub-6420074467468909~2665521232
          ADMOB_BANNER_ID: ca-app-pub-6420074467468909/3327866218
          ADMOB_INTERSTITIAL_ID: ca-app-pub-6420074467468909/8627248172
  StatikaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StatikaUITests
    dependencies:
      - target: Statika
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Statika:
    build:
      targets:
        Statika: all
        StatikaUITests: [test]
    # Lokální konfigurace StoreKit – nákup „bez reklamy“ funguje v simulátoru spuštěném z Xcode.
    run:
      storeKitConfiguration: Statika/Statika.storekit
    test:
      targets:
        - StatikaUITests
